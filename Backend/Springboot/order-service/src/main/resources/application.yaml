spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:./order-service/.env[.properties],optional:file:../order-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:order_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:kakarot1996}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        spring.json.value.type.method: com.beverage.order.application.event.OrderEventWrapper
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:*,https://*.ngrok-free.app,https://*.ngrok-free.dev}
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
  # SEC-01: Khóa bí mật dùng khi gọi internal endpoint của inventory-service
  # Phải khớp với INTERNAL_SERVICE_SECRET trong inventory-service
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:internal-beverage-secret-2024}
  order-cache:
    detail-ttl-seconds: 60
  order-payment:
    # timeout-minutes: ${ORDER_TIMEOUT_MINUTES:30}
    timeout-minutes: 30
  cache:
    product-ttl-seconds: 300
  idempotency:
    ttl-hours: 24
  guest-session:
    ttl-hours: 24

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    enabled: true

jwt:
  secret-key: ${JWT_SECRET_KEY:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yand0dG9rZW5nZW5lcmF0aW9uYW5kZGVjcnlwdGlvbg==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:60000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

auth:
  access-cookie:
    name: ${AUTH_ACCESS_COOKIE_NAME:accessToken}

springdoc:
  api-docs:
    path: /order/v3/api-docs
  swagger-ui:
    path: /order/swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
