#Do nhiều service quá em sợ bị lẫn lộn với lại đây là project thực tập 
#Nên cho phép em tạm push các biến môi trường lên luôn nha anh 
#Khi nào gần xong hết em sẽ trau chuốt sửa lại rồi bỏ vô .env 
# Secret (POSTGRES_PASSWORD, JWT_SECRET_KEY, AWS_*) nên đặt trong .env — không commit .env.

spring:
  application:
    name: product-service
  # Đọc file .env cùng thư mục làm việc khi chạy (IDE: đặt Working directory = module product-service).
  config:
    import: optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:./product-service/.env[.properties],optional:file:../product-service/.env[.properties],optional:file:./Backend/Springboot/product-service/.env[.properties]
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:product_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:kakarot1996}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    enabled: true

jwt:
  secret-key: ${JWT_SECRET_KEY:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9yand0dG9rZW5nZW5lcmF0aW9uYW5kZGVjcnlwdGlvbg==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

auth:
  access-cookie:
    name: ${AUTH_ACCESS_COOKIE_NAME:accessToken}

# shared-storage — bật khi đã cấu hình bucket + credential (ưu tiên biến môi trường / Run Configuration, không nhét secret vào YAML).
beverage:
  storage:
    s3:
      enabled: ${BEVERAGE_STORAGE_S3_ENABLED:true}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-southeast-1}
      key-prefix: ${AWS_S3_KEY_PREFIX:beverage/dev}
      max-bytes: 5242880
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.ngrok-free.app,https://*.ngrok-free.dev}

springdoc:
  api-docs:
    path: /product/v3/api-docs
  swagger-ui:
    path: /product/swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
