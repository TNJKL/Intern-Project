server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:internal-beverage-secret-2024}    
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Default filters áp dụng cho tất cả routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # ============================================================
        # Auth Service
        # ============================================================
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        # ============================================================
        # Product Service
        # ============================================================
        - id: product-service-categories
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/categories,/api/v1/categories/**
        - id: product-service-products
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: product-service-toppings
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/toppings,/api/v1/toppings/**
        - id: product-service-storage
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/storage,/api/v1/storage/**

        # ============================================================
        # Order Service
        # ============================================================
        - id: order-service-orders
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**
        - id: order-service-admin
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/admin/orders,/api/v1/admin/orders/**
        - id: order-service-vouchers-public
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/vouchers,/api/v1/vouchers/**
        - id: order-service-vouchers-admin
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/admin/vouchers,/api/v1/admin/vouchers/**

        # ============================================================
        # Inventory Service — Public & Admin routes (exposed qua gateway)
        # ⚠️  /api/v1/inventory/check-availability KHÔNG có ở đây
        #     vì endpoint đó chỉ dành cho internal service-to-service call
        #     (order-service gọi trực tiếp, không qua gateway)
        # ============================================================

        # Admin endpoints — thêm rate limiting để chống abuse
        - id: inventory-service-admin
          uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8084}
          predicates:
            - Path=/api/v1/admin/ingredients,/api/v1/admin/ingredients/**,/api/v1/admin/recipes,/api/v1/admin/recipes/**,/api/v1/admin/inventory,/api/v1/admin/inventory/**
          filters:
            # Rate limit: 20 req/s, burst tối đa 40 — chỉ admin dùng nên rộng tay hơn
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

# ============================================================
# SEC-01 — Internal endpoint protection
# /check-availability KHÔNG được route qua gateway
# order-service gọi trực tiếp: http://inventory-service:8084/api/v1/inventory/check-availability
# với header "X-Internal-Secret: <secret>" để inventory-service xác thực
# ============================================================


 

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
