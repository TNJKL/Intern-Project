server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth: users CRUD
        # SWITCH (docker-compose env):
        # - auth local  -> AUTH_SERVICE_URI=http://host.docker.internal:8081
        # - auth docker -> AUTH_SERVICE_URI=http://auth-service:8081
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/users/**
        # Auth: login / refresh / logout / register
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Product catalog
        # SWITCH:
        # - product local  -> PRODUCT_SERVICE_URI=http://host.docker.internal:8082
        # - product docker -> PRODUCT_SERVICE_URI=http://product-service:8082
        - id: product-service-categories
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/categories,/api/v1/categories/**
        - id: product-service-products
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: product-service-toppings
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/toppings,/api/v1/toppings/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
