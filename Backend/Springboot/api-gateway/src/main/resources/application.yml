server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route cho auth-service (users management)
        - id: auth-service
          # SWITCH POINT:
          # - auth local  -> http://host.docker.internal:8081
          # - auth docker -> http://auth-service:8081
          uri: ${AUTH_SERVICE_URI:http://host.docker.internal:8081}

          predicates:
            - Path=/api/v1/users/**
        # Route cho auth-service (login/auth endpoints)
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URI:http://host.docker.internal:8081}
          predicates:
            - Path=/api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
