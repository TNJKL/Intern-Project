server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth: users CRUD
        # SWITCH (docker-compose env):
        # - auth local  -> AUTH_SERVICE_URI=http://host.docker.internal:8081
        # - auth docker -> AUTH_SERVICE_URI=http://auth-service:8081
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/users/**
        # Auth: login / refresh / logout / register
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Product catalog
        # SWITCH:
        # - product local  -> PRODUCT_SERVICE_URI=http://host.docker.internal:8082
        # - product docker -> PRODUCT_SERVICE_URI=http://product-service:8082
        - id: product-service-categories
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/categories,/api/v1/categories/**
        - id: product-service-products
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: product-service-toppings
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/toppings,/api/v1/toppings/**
        # Upload ảnh (shared-storage qua product-service)
        - id: product-service-storage
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/storage,/api/v1/storage/**

        # Order service
        # SWITCH:
        # - order local  -> ORDER_SERVICE_URI=http://host.docker.internal:8083
        # - order docker -> ORDER_SERVICE_URI=http://order-service:8083
        - id: order-service-orders
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**
        - id: order-service-admin
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/admin/orders,/api/v1/admin/orders/**

        # Voucher service (order-service)
        - id: order-service-vouchers-public
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/vouchers,/api/v1/vouchers/**
        - id: order-service-vouchers-admin
          uri: ${ORDER_SERVICE_URI:http://order-service:8083}
          predicates:
            - Path=/api/v1/admin/vouchers,/api/v1/admin/vouchers/**

        # Inventory service
        # SWITCH:
        # - inventory local  -> INVENTORY_SERVICE_URI=http://host.docker.internal:8084
        # - inventory docker -> INVENTORY_SERVICE_URI=http://inventory-service:8084
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://inventory-service:8084}
          predicates:
            - Path=/api/v1/inventory,/api/v1/inventory/**,/api/v1/admin/ingredients,/api/v1/admin/ingredients/**,/api/v1/admin/recipes,/api/v1/admin/recipes/**,/api/v1/admin/inventory,/api/v1/admin/inventory/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
