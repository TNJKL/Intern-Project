server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route cho auth-service (users management)
        - id: auth-service
          # SWITCH POINT:
          # - Khi auth-service chạy Docker: AUTH_SERVICE_URI=http://auth-service:8081
          # - Khi auth-service chạy local:  AUTH_SERVICE_URI=http://host.docker.internal:8081
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}

          predicates:
            - Path=/api/v1/users/**
        # Route cho auth-service (login/auth endpoints)
        - id: auth-service-auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Route cho product-service (product management)
        - id: product-service
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/categories,/api/v1/categories/**
        - id: product-service-products
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
        - id: product-service-toppings
          uri: ${PRODUCT_SERVICE_URI:http://product-service:8082}
          predicates:
            - Path=/api/v1/toppings,/api/v1/toppings/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
