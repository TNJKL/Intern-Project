services:
  # ============================================================
  # SERVICE REGISTRY
  # ============================================================
  eureka-server:
    build:
      context: ./Springboot/eureka-server
    container_name: beverage_eureka
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    mem_limit: 256m
    cpus: "0.50"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # API GATEWAY
  # ============================================================
  api-gateway:
    build:
      context: ./Springboot/api-gateway
    container_name: beverage_gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # SWITCH POINT:
      # - Docker auth-service  -> http://auth-service:8081 (cùng network beverage_net)
      # - Local auth-service   -> http://host.docker.internal:8081
      - AUTH_SERVICE_URI=http://auth-service:8081
      #- AUTH_SERVICE_URI=http://host.docker.internal:8081
      # SWITCH POINT:
      # - Docker product-service -> http://product-service:8082 (cùng network beverage_net)
      # - Local product-service  -> http://host.docker.internal:8082
      - PRODUCT_SERVICE_URI=http://product-service:8082
      # - ORDER_SERVICE_URI=http://order-service:8083  # Docker (khi order-service trong docker)
      - ORDER_SERVICE_URI=http://host.docker.internal:8083  # Local dev
      - INVENTORY_SERVICE_URI=http://host.docker.internal:8084
      - PAYMENT_SERVICE_URI=http://host.docker.internal:8085
      - DASHBOARD_SERVICE_URI=http://host.docker.internal:8086
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 288m
    cpus: "0.50"
    depends_on:
      - eureka-server
      - auth-service
      - product-service
      # - order-service  # Đang dev local, chạy riêng
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # SHARED POSTGRESQL INSTANCE (6 Databases)
  # Chỉ tạo databases rỗng, schema sẽ được tạo bởi Code-First Migration
  # ============================================================
  postgres-common:
    image: postgres:15-alpine
    container_name: beverage_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env  
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db-scripts/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
      - postgres_common_data:/var/lib/postgresql/data
    command: >-
      sh -c "echo 'host all all 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf
      && exec docker-entrypoint.sh postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=80"
    mem_limit: 192m
    cpus: "0.50"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth-service:
    build:
      context: ./Springboot
      dockerfile: auth-service/Dockerfile
    container_name: beverage_auth_service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - POSTGRES_HOST=postgres-common
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    mem_limit: 448m
    cpus: "0.75"
    depends_on:
      - eureka-server
      - postgres-common
      - redis
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # PRODUCT SERVICE
  # ============================================================
  product-service:
    build:
      context: ./Springboot
      dockerfile: product-service/Dockerfile
    container_name: beverage_product_service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - POSTGRES_HOST=postgres-common
      - POSTGRES_DB=product_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      - BEVERAGE_STORAGE_S3_ENABLED=${BEVERAGE_STORAGE_S3_ENABLED:-true}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_S3_KEY_PREFIX=${AWS_S3_KEY_PREFIX:-beverage/dev}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      # Credential S3 — đặt trong Backend/.env (Compose tự substitute ${...} khi chạy từ thư mục Backend)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
    mem_limit: 560m
    cpus: "0.75"
    depends_on:
      - eureka-server
      - postgres-common
      - redis
    restart: always
    networks:
      - beverage_net

