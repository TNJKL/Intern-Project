services:
  # ============================================================
  # SERVICE REGISTRY
  # ============================================================
  eureka-server:
    build:
      context: ./Springboot/eureka-server
    container_name: beverage_eureka
    ports:
      - "8761:8761"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # API GATEWAY
  # ============================================================
  api-gateway:
    build:
      context: ./Springboot/api-gateway
    container_name: beverage_gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      # SWITCH POINT:
      # - Docker auth-service  -> http://auth-service:8081
      # - Local auth-service   -> http://host.docker.internal:8081
      - AUTH_SERVICE_URI=http://auth-service:8081
      # SWITCH POINT:
      # - Docker product-service -> http://product-service:8082
      # - Local product-service  -> http://host.docker.internal:8082
      - PRODUCT_SERVICE_URI=http://host.docker.internal:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka-server
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # SHARED POSTGRESQL INSTANCE (6 Databases)
  # Chỉ tạo databases rỗng, schema sẽ được tạo bởi Code-First Migration
  # ============================================================
  postgres-common:
    image: postgres:15-alpine
    container_name: beverage_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env  
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db-scripts/01-init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql
      - postgres_common_data:/var/lib/postgresql/data
    command: sh -c "echo 'host all all 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf && docker-entrypoint.sh postgres"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # AUTH SERVICE
  # ============================================================
  auth-service:
    build:
      context: ./Springboot/auth-service
    container_name: beverage_auth_service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - POSTGRES_HOST=postgres-common
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
    depends_on:
      - eureka-server
      - postgres-common
      - redis
    restart: always
    networks:
      - beverage_net

