services:
  eureka-server:
    build:
      context: ./Springboot/eureka-server
    container_name: beverage_eureka
    ports:
      - "8761:8761"
    restart: always
    networks:
      - beverage_net

  api-gateway:
    build:
      context: ./Springboot/api-gateway
    container_name: beverage_gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: always
    networks:
      - beverage_net

  auth-service:
    build:
      context: ./Springboot/auth-service
    container_name: beverage_auth_service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - eureka-server
      - postgres
    restart: always
    networks:
      - beverage_net

  nestjs-cluster:
    build:
      context: ./NestJS/realtime-service
    container_name: beverage_nestjs_cluster
    ports:
      - "3001:3001"
    depends_on:
      - redis
      - kafka
    restart: always
    networks:
      - beverage_net

  nginx-gateway:
    image: nginx:latest
    container_name: beverage_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - beverage_net

  redis:
    image: redis:alpine
    container_name: beverage_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - beverage_net

  kafka:
    image: apache/kafka:3.7.0
    container_name: beverage_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@beverage_kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://beverage_kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - beverage_net

  postgres:
    image: postgres:15-alpine
    container_name: beverage_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - beverage_net

networks:
  beverage_net:
    driver: bridge

volumes:
  redis_data:
  kafka_data:
  postgres_data: