  # ============================================================
  # NGINX GATEWAY
  # ============================================================
  nginx-gateway:
    image: nginx:latest
    container_name: beverage_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 32m
    cpus: "0.25"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:alpine
    container_name: beverage_redis
    ports:
      - "6379:6379" # 6380 là port để kết nối từ client lưu ý do máy vừa có redis local nên không dùng port 6379  
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 48m
    cpus: "0.25"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # APACHE KAFKA
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: beverage_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@beverage_kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://beverage_kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 768m
    cpus: "0.50"
    restart: always
    networks:
      - beverage_net

# ============================================================
# NETWORKS
# ============================================================
networks:
  beverage_net:
    driver: bridge

# ============================================================
# VOLUMES - Data persists until explicitly removed
# ============================================================
volumes:
  postgres_common_data:
  redis_data:
  kafka_data:
