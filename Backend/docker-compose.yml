  # ============================================================
  # NESTJS CLUSTER (Chat/Realtime Service)
  # ============================================================
  nestjs-cluster:
    build:
      context: ./NestJS/realtime-service
    container_name: beverage_nestjs_cluster
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017/chat_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
      - kafka
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # NGINX GATEWAY
  # ============================================================
  nginx-gateway:
    image: nginx:latest
    container_name: beverage_nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:alpine
    container_name: beverage_redis
    ports:
      - "6379:6379" # 6380 là port để kết nối từ client lưu ý do máy vừa có redis local nên không dùng port 6379  
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - beverage_net

  # ============================================================
  # APACHE KAFKA
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: beverage_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@beverage_kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://beverage_kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - beverage_net

# ============================================================
# NETWORKS
# ============================================================
networks:
  beverage_net:
    driver: bridge

# ============================================================
# VOLUMES - Data persists until explicitly removed
# ============================================================
volumes:
  postgres_common_data:
  redis_data:
  kafka_data:
