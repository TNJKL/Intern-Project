events {
    worker_connections 1024;
}

http { 

    # Cấu hình DNS của Docker để Nginx tự động phân giải lại IP khi container khởi động lại (Hết lỗi 502)
    resolver 127.0.0.11 valid=5s;
    # 1. Định hướng tới Spring Cloud Gateway (Xử lý API)
    upstream scg_gateway {
        server api-gateway:8080;
    }
    #Hello test trên linux :DDD	
    # 2. Định hướng tới Auth Service
    # SWITCH POINT:
    # - Docker auth-service  -> server auth-service:8081;
    # - Local auth-service   -> server host.docker.internal:8081;
    upstream auth_service {
        server auth-service:8081;
    }

     #khai báo thêm upstream cho product-service
    upstream product_service {
        server host.docker.internal:8082;
    }

    upstream order_service {
        server host.docker.internal:8083;
    }

    upstream inventory_service {
        server host.docker.internal:8084;
    }

    upstream payment_service {
        server host.docker.internal:8085;
    }

    upstream dashboard_service {
        server host.docker.internal:8086;
    }


    # 3. Định hướng tới NestJS Cluster (Xử lý Socket + Notification)
    upstream nestjs_cluster {
    #    server notification-service:3001;
      server host.docker.internal:3001;
    }

    server {
        listen 80;
         #server_name localhost;
        #server_name 10.86.157.43:80;
        server_name _;

        # Định hướng API nghiệp vụ (HTTP REST) của Notification Service tới NestJS Cluster (bỏ qua Spring Cloud Gateway)
        location /api/v1/notifications {
            proxy_pass http://nestjs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Bắt buộc forward JWT
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # Mọi Request bắt đầu bằng /api/ sẽ chui vào Spring Cloud Gateway
        location /api/ {
            proxy_pass http://scg_gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Bắt buộc forward JWT — không có dòng này thường gặp 403 trên PUT/POST dù đã login
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # Mọi Request bắt đầu bằng /ws sẽ chui thẳng vào NestJS mà không qua SCG (Xử lý realtime Socket.IO)
        location /ws {
            proxy_pass http://nestjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger UI - Auth Service (giữ nguyên path mặc định springdoc)
        location /swagger-ui/ {
            proxy_pass http://auth_service/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui.html {
            proxy_pass http://auth_service/swagger-ui.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger API Docs - Auth Service
        location /v3/api-docs {
            proxy_pass http://auth_service/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api-docs {
            proxy_pass http://auth_service/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Product Service (cùng host, path /product/* để không đè auth)
        location /product/ {
            proxy_pass http://product_service/product/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Swagger + OpenAPI - Order Service (path /order/* để không đè auth)
        location /order/ {
            proxy_pass http://order_service/order/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Inventory Service (path /inventory/* để không đè auth)
        location /inventory/ {
            proxy_pass http://inventory_service/inventory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Payment Service (path /payment/* để không đè auth)
        location /payment/ {
            proxy_pass http://payment_service/payment/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Dashboard Service (path /dashboard/* để không đè auth)
        location /dashboard/ {
            proxy_pass http://dashboard_service/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Notification Service (NestJS)
        location /notification-docs/ {
            proxy_pass http://nestjs_cluster/notification-docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/ {
            proxy_pass http://order_service/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}