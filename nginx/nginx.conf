events {
    worker_connections 1024;
}

http {
    # 1. Định hướng tới Spring Cloud Gateway (Xử lý API)
    upstream scg_gateway {
        server api-gateway:8080;
    }

    # 2. Định hướng tới Auth Service
    # SWITCH POINT:
    # - Docker auth-service  -> server auth-service:8081;
    # - Local auth-service   -> server host.docker.internal:8081;
    upstream auth_service {
        server auth-service:8081;
    }

     #khai báo thêm upstream cho product-service
    upstream product_service {
        server host.docker.internal:8082;
    }


    # 3. Định hướng tới NestJS Cluster (Xử lý Socket)
    upstream nestjs_cluster {
        server host.docker.internal:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # Mọi Request bắt đầu bằng /api/ sẽ chui vào Spring Cloud Gateway
        location /api/ {
            proxy_pass http://scg_gateway/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Mọi Request bắt đầu bằng /ws/ sẽ chui thẳng vào NestJS mà không qua SCG
        location /ws/ {
            proxy_pass http://nestjs_cluster/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger UI - Auth Service (giữ nguyên path mặc định springdoc)
        location /swagger-ui/ {
            proxy_pass http://auth_service/swagger-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger-ui.html {
            proxy_pass http://auth_service/swagger-ui.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger API Docs - Auth Service
        location /v3/api-docs {
            proxy_pass http://auth_service/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api-docs {
            proxy_pass http://auth_service/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger + OpenAPI - Product Service (cùng host, path /product/* để không đè auth)
        location /product/ {
            proxy_pass http://product_service/product/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
