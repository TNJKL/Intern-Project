name: CI - Order Service

on:
  push:
    branches:
      - dev
      - 'feature/order-service'
      - 'feature/order*'
    paths:
      - 'Backend/Springboot/order-service/**'
      - 'Backend/Springboot/shared-jwt/**'
      - '.github/workflows/order-service.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/order-service/**'
      - 'Backend/Springboot/shared-jwt/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # - name: Build Order Service
      #   working-directory: Backend/Springboot/order-service
      #   run: mvn clean compile -DskipTests

      # - name: Test Order Service
      #   working-directory: Backend/Springboot/order-service
      #   run: mvn test

      # Đứng ở thư mục chứa cả 2 module để build
      - name: Build Order Service and Dependencies
        working-directory: Backend/Springboot
        run: mvn clean install -pl order-service --am -DskipTests

      # Chạy test riêng cho order-service
      - name: Test Order Service
        working-directory: Backend/Springboot/order-service
        run: mvn test
