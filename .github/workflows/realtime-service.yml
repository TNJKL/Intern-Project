name: CI - Realtime Service

on:
  push:
    branches:
      - dev
      - 'feature/realtime-service'
    paths:
      - 'Backend/NestJS/realtime-service/**'
      - '.github/workflows/realtime-service.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/NestJS/realtime-service/**'
      - '.github/workflows/realtime-service.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Backend/NestJS/realtime-service/package-lock.json'

      - name: Install dependencies
        working-directory: Backend/NestJS/realtime-service
        run: npm ci

      - name: Run Lint
        working-directory: Backend/NestJS/realtime-service
        run: npm run lint
        continue-on-error: true # Cho phép bypass nếu có lỗi lint nhỏ, hoặc bạn có thể bỏ dòng này nếu muốn bắt buộc code sạch lint.

      - name: Build Realtime Service
        working-directory: Backend/NestJS/realtime-service
        run: npm run build
