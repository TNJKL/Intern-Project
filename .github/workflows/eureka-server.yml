name: CI - Eureka Server

on:
  push:
    branches:
      - dev
      - 'feature/eureka-server'
      - 'feature/eureka*'
    paths:
      - 'Backend/Springboot/eureka-server/**'
      - '.github/workflows/eureka-server.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/eureka-server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Eureka Server
        working-directory: Backend/Springboot/eureka-server
        run: mvn clean compile -DskipTests
