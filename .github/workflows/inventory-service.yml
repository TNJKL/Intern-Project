name: CI - Inventory Service

on:
  push:
    branches:
      - dev
      - 'feature/inventory-service'
      - 'feature/inventory*'
    paths:
      - 'Backend/Springboot/inventory-service/**'
      - 'Backend/Springboot/shared-jwt/**'
      - '.github/workflows/inventory-service.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/inventory-service/**'
      - 'Backend/Springboot/shared-jwt/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build shared-jwt
        working-directory: Backend/Springboot
        run: mvn install -DskipTests -pl shared-jwt

      - name: Build Inventory Service
        working-directory: Backend/Springboot/inventory-service
        run: mvn clean compile -DskipTests
