name: CI - Dashboard Service

on:
  push:
    branches:
      - dev
      - 'feature/dashboard-service'
      - 'feature/dashboard*'
    paths:
      - 'Backend/Springboot/dashboard-service/**'
      - 'Backend/Springboot/shared-jwt/**'
      - '.github/workflows/dashboard-service.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/dashboard-service/**'
      - 'Backend/Springboot/shared-jwt/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build shared-jwt
        working-directory: Backend/Springboot
        run: mvn install -DskipTests -pl shared-jwt

      - name: Run Unit Tests
        working-directory: Backend/Springboot/dashboard-service
        run: mvn test
        env:
          SPRING_DATA_REDIS_HOST: localhost

      - name: Build Dashboard Service
        working-directory: Backend/Springboot/dashboard-service
        run: mvn clean package -DskipTests

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-dashboard
          path: Backend/Springboot/dashboard-service/target/surefire-reports/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-service-jar
          path: Backend/Springboot/dashboard-service/target/*.jar
