name: CI - API Gateway

on:
  push:
    branches:
      - dev
      - 'feature/api-gateway'
      - 'feature/gateway*'
    paths:
      - 'Backend/Springboot/api-gateway/**'
      - 'Backend/Springboot/shared-jwt/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/api-gateway/**'
      - 'Backend/Springboot/shared-jwt/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build API Gateway
        working-directory: Backend/Springboot/api-gateway
        run: mvn clean compile -DskipTests

      - name: Test API Gateway
        working-directory: Backend/Springboot/api-gateway
        run: mvn test
