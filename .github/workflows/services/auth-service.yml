name: CI - Auth Service

on:
  push:
    branches:
      - dev
      - 'feature/auth-service'
      - 'feature/auth*'
    paths:
      - 'Backend/Springboot/auth-service/**'
      - 'Backend/Springboot/shared-jwt/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/auth-service/**'
      - 'Backend/Springboot/shared-jwt/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Auth Service
        working-directory: Backend/Springboot/auth-service
        run: mvn clean compile -DskipTests

      - name: Test Auth Service
        working-directory: Backend/Springboot/auth-service
        run: mvn test
