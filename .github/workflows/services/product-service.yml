name: CI - Product Service

on:
  push:
    branches:
      - dev
      - 'feature/product-service'
      - 'feature/product*'
    paths:
      - 'Backend/Springboot/product-service/**'
      - 'Backend/Springboot/shared-jwt/**'
      - 'Backend/Springboot/shared-storage/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/product-service/**'
      - 'Backend/Springboot/shared-jwt/**'
      - 'Backend/Springboot/shared-storage/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Product Service
        working-directory: Backend/Springboot/product-service
        run: mvn clean compile -DskipTests

      - name: Test Product Service
        working-directory: Backend/Springboot/product-service
        run: mvn test
