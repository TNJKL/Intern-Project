name: CI - Shared Storage

on:
  push:
    branches:
      - dev
      - 'feature/**'
    paths:
      - 'Backend/Springboot/shared-storage/**'
      - '.github/workflows/shared-storage.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'Backend/Springboot/shared-storage/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Install Shared Storage
        working-directory: Backend/Springboot/shared-storage
        run: mvn clean install -DskipTests
